<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classificateur de Films</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="logo">
                <h1>🎬 FilmHub</h1>
            </div>
            <nav class="nav-menu">
                <button class="nav-item active" data-filter="all">
                    <span class="icon">📽️</span> Tous les films
                </button>
                <button class="nav-item" data-filter="genre">
                    <span class="icon">🎭</span> Par Genre
                </button>
                <button class="nav-item" data-filter="category">
                    <span class="icon">📂</span> Par Catégorie
                </button>
                <button class="nav-item" data-filter="favorites">
                    <span class="icon">⭐</span> Favoris
                </button>
                <button class="nav-item" data-filter="watching">
                    <span class="icon">▶️</span> En Visionnage
                </button>
            </nav>
            <div class="sidebar-footer">
                <button class="btn-add-movie" id="addMovieBtn">
                    <span>+</span> Ajouter un film
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="header">
                <div class="search-bar">
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="🔍 Rechercher un film..."
                        class="search-input"
                    >
                </div>
                <div class="header-stats">
                    <div class="stat">
                        <span class="stat-number" id="totalMovies">0</span>
                        <span class="stat-label">Films</span>
                    </div>
                    <div class="stat">
                        <span class="stat-number" id="watchingCount">0</span>
                        <span class="stat-label">En Cours</span>
                    </div>
                </div>
            </header>

            <!-- Filter Tabs -->
            <div class="filter-section">
                <div class="genre-filters" id="genreFilters"></div>
            </div>

            <!-- Movies Grid -->
            <section class="movies-grid" id="moviesGrid">
                <div class="empty-state">
                    <p>📭 Aucun film pour le moment</p>
                    <p class="empty-subtitle">Commencez en ajoutant votre premier film</p>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal Add Movie -->
    <div class="modal" id="movieModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Ajouter un nouveau film</h2>
                <button class="close-btn" id="closeModal">&times;</button>
            </div>
            <form id="movieForm" class="movie-form">
                <div class="form-group">
                    <label for="movieTitle">Titre du film</label>
                    <input type="text" id="movieTitle" required placeholder="Ex: Inception">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="movieYear">Année</label>
                        <input type="number" id="movieYear" min="1800" max="2099" placeholder="2010">
                    </div>
                    <div class="form-group">
                        <label for="movieRating">Note (/10)</label>
                        <input type="number" id="movieRating" min="0" max="10" step="0.5" placeholder="8.5">
                    </div>
                </div>

                <div class="form-group">
                    <label for="movieGenre">Genre</label>
                    <select id="movieGenre" required>
                        <option value="">-- Sélectionner un genre --</option>
                        <option value="Action">Action</option>
                        <option value="Comédie">Comédie</option>
                        <option value="Drame">Drame</option>
                        <option value="Science-fiction">Science-fiction</option>
                        <option value="Horreur">Horreur</option>
                        <option value="Romance">Romance</option>
                        <option value="Thriller">Thriller</option>
                        <option value="Animation">Animation</option>
                        <option value="Documentaire">Documentaire</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="movieCategory">Catégorie</label>
                    <select id="movieCategory" required>
                        <option value="">-- Sélectionner une catégorie --</option>
                        <option value="Cinéma">Cinéma</option>
                        <option value="Série">Série</option>
                        <option value="Film court">Film court</option>
                        <option value="Documentaire">Documentaire</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="movieDescription">Description</label>
                    <textarea id="movieDescription" placeholder="Résumé du film..." rows="3"></textarea>
                </div>

                <div class="form-group">
                    <label for="movieImage">URL de l'affiche</label>
                    <input type="url" id="movieImage" placeholder="https://...">
                </div>

                <div class="form-group">
                    <label for="movieLink">Lien de Visionnage</label>
                    <input type="url" id="movieLink" placeholder="https://... (Netflix, YouTube, etc)">
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-cancel" id="cancelBtn">Annuler</button>
                    <button type="submit" class="btn-submit">Ajouter le film</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Movie Details Modal -->
    <div class="modal" id="detailsModal">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h2 id="detailTitle"></h2>
                <button class="close-btn" id="closeDetails">&times;</button>
            </div>
            <div class="movie-details" id="movieDetails"></div>
        </div>
    </div>

    <!-- Video Player Modal -->
    <div class="modal" id="playerModal">
        <div class="modal-content modal-video">
            <div class="video-player-wrapper">
                <button class="close-btn-video" id="closePlayer">&times;</button>
                <div class="video-player" id="videoPlayer">
                    <video id="videoElement" controls style="width: 100%; height: 100%;">
                        <source src="" type="video/mp4">
                        Votre navigateur ne supporte pas la lecture vidéo HTML5.
                    </video>
                </div>
                <div class="video-info" id="videoInfo"></div>
            </div>
        </div>
    </div>

    <!-- Player avec URL Modal -->
    <div class="modal" id="urlPlayerModal">
        <div class="modal-content modal-video">
            <div class="video-player-wrapper">
                <button class="close-btn-video" id="closeUrlPlayer">&times;</button>
                <div class="url-player-container">
                    <div class="url-player-info">
                        <h2 id="urlMovieTitle"></h2>
                        <p id="urlMovieDesc"></p>
                        <a id="urlPlayerLink" href="" target="_blank" class="btn-watch-online">
                            🎬 Regarder en ligne
                        </a>
                        <p class="url-player-note">Le lien s'ouvrira dans un nouvel onglet</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
